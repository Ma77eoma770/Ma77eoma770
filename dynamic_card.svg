<svg width="800" height="318" viewBox="0 0 800 318" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Orbitron:wght@600;800&amp;display=swap');
    </style>

    <clipPath id="card-clip">
      <rect x="10" y="10" width="780" height="298" rx="20" />
    </clipPath>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="40%" stop-color="#f5c2e7" />
      <stop offset="75%" stop-color="#fab387" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c2e7" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <linearGradient id="sep-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#313244" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#cba6f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#89b4fa" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#cba6f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#313244" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f17" />
      <stop offset="45%" stop-color="#181825" />
      <stop offset="80%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#282338" />
    </linearGradient>

    <linearGradient id="star-trail-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0" />
      <stop offset="70%" stop-color="#f5c2e7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="star-trail-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0" />
      <stop offset="75%" stop-color="#cba6f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow-dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-bg {
      fill: url(#bg-grad);
      stroke: url(#border-grad);
      stroke-width: 1.75;
      rx: 20px;
    }
    .section-label {
      font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: #f5e0dc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      opacity: 0.9;
    }
    .main-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: #cdd6f4;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .hero-name {
      fill: url(#title-grad);
    }
    .sub-stats {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: #a6adc8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .stat-val {
      font-weight: 700;
    }
    .skill-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: #cdd6f4;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1px;
    }
    .percentage {
      font-family: 'Orbitron', 'Inter', sans-serif;
      fill: #bac2de;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .track {
      fill: #313244;
      opacity: 0.7;
    }
    @keyframes loadBar {
      from { width: 0px; }
      to { width: var(--target-width); }
    }
    .animated-bar {
      animation: loadBar 1.5s cubic-bezier(0.1, 1, 0.1, 1) forwards;
      filter: drop-shadow(0px 0px 2px rgba(203, 166, 247, 0.4));
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }
    .star {
      animation: twinkle var(--duration, 3s) infinite ease-in-out var(--delay, 0s);
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes shootingStar1 {
      0% { transform: translate(120px, -40px); opacity: 0; }
      10% { opacity: 0.95; }
      45% { transform: translate(620px, 210px); opacity: 0; }
      100% { transform: translate(620px, 210px); opacity: 0; }
    }
    @keyframes shootingStar2 {
      0%, 30% { transform: translate(350px, -40px); opacity: 0; }
      40% { opacity: 0.85; }
      75% { transform: translate(850px, 210px); opacity: 0; }
      100% { transform: translate(850px, 210px); opacity: 0; }
    }
    @keyframes shootingStar3 {
      0%, 60% { transform: translate(50px, -30px); opacity: 0; }
      68% { opacity: 0.9; }
      92% { transform: translate(550px, 220px); opacity: 0; }
      100% { transform: translate(550px, 220px); opacity: 0; }
    }
    .shooting-star-1 { animation: shootingStar1 8s infinite ease-out; }
    .shooting-star-2 { animation: shootingStar2 9s infinite ease-out; }
    .shooting-star-3 { animation: shootingStar3 7s infinite ease-out; }
  </style>

  <rect class="card-bg" x="10" y="10" width="780" height="298" />

  <g clip-path="url(#card-clip)">
    <circle class="star" cx="674" cy="77" r="0.8" fill="#cdd6f4" style="--duration: 2.7s; --delay: 0.8s;" />
    <circle class="star" cx="124" cy="64" r="1.6" fill="#cdd6f4" style="--duration: 2.1s; --delay: 0.3s;" />
    <circle class="star" cx="258" cy="278" r="1.6" fill="#cdd6f4" style="--duration: 3.4s; --delay: 2.5s;" />
    <circle class="star" cx="738" cy="234" r="1.1" fill="#cdd6f4" style="--duration: 3.5s; --delay: 2.8s;" />
    <circle class="star" cx="26" cy="101" r="1.8" fill="#cdd6f4" style="--duration: 2.9s; --delay: 0.5s;" />
    <circle class="star" cx="364" cy="72" r="0.9" fill="#cdd6f4" style="--duration: 2.2s; --delay: 3.0s;" />
    <circle class="star" cx="638" cy="155" r="1.9" fill="#cdd6f4" style="--duration: 3.8s; --delay: 1.9s;" />
    <circle class="star" cx="407" cy="60" r="1.6" fill="#cdd6f4" style="--duration: 4.1s; --delay: 2.2s;" />
    <circle class="star" cx="390" cy="118" r="1.8" fill="#cdd6f4" style="--duration: 2.1s; --delay: 0.8s;" />
    <circle class="star" cx="316" cy="60" r="2.0" fill="#cdd6f4" style="--duration: 4.2s; --delay: 1.3s;" />
    <circle class="star" cx="484" cy="206" r="1.0" fill="#cdd6f4" style="--duration: 2.9s; --delay: 2.3s;" />
    <circle class="star" cx="738" cy="56" r="1.7" fill="#cdd6f4" style="--duration: 2.4s; --delay: 2.6s;" />
    <circle class="star" cx="187" cy="256" r="1.3" fill="#cdd6f4" style="--duration: 4.5s; --delay: 2.2s;" />
    <circle class="star" cx="590" cy="132" r="1.8" fill="#cdd6f4" style="--duration: 4.1s; --delay: 2.7s;" />
    <circle class="star" cx="254" cy="36" r="1.9" fill="#cdd6f4" style="--duration: 3.0s; --delay: 0.2s;" />
    <circle class="star" cx="600" cy="181" r="1.1" fill="#cdd6f4" style="--duration: 3.2s; --delay: 3.1s;" />
    <circle class="star" cx="678" cy="254" r="1.0" fill="#cdd6f4" style="--duration: 2.3s; --delay: 2.6s;" />
    <circle class="star" cx="571" cy="154" r="1.8" fill="#cdd6f4" style="--duration: 3.1s; --delay: 2.0s;" />
    <circle class="star" cx="390" cy="132" r="2.2" fill="#cdd6f4" style="--duration: 2.3s; --delay: 1.7s;" />
    <circle class="star" cx="68" cy="76" r="1.0" fill="#cdd6f4" style="--duration: 2.4s; --delay: 2.4s;" />
    <circle class="star" cx="630" cy="52" r="1.3" fill="#cdd6f4" style="--duration: 3.5s; --delay: 1.6s;" />
    <circle class="star" cx="277" cy="25" r="1.8" fill="#cdd6f4" style="--duration: 2.3s; --delay: 3.1s;" />
    <circle class="star" cx="293" cy="194" r="1.0" fill="#cdd6f4" style="--duration: 3.1s; --delay: 1.6s;" />
    <circle class="star" cx="759" cy="154" r="2.2" fill="#cdd6f4" style="--duration: 3.9s; --delay: 1.8s;" />
    <circle class="star" cx="128" cy="172" r="2.0" fill="#cdd6f4" style="--duration: 3.3s; --delay: 0.7s;" />
    <circle class="star" cx="402" cy="102" r="1.6" fill="#cdd6f4" style="--duration: 3.9s; --delay: 1.9s;" />
    <circle class="star" cx="20" cy="185" r="1.5" fill="#cdd6f4" style="--duration: 2.3s; --delay: 1.3s;" />
    <circle class="star" cx="334" cy="142" r="0.9" fill="#cdd6f4" style="--duration: 4.2s; --delay: 3.3s;" />
    <circle class="star" cx="107" cy="268" r="1.9" fill="#cdd6f4" style="--duration: 4.4s; --delay: 1.9s;" />
    <circle class="star" cx="148" cy="85" r="1.7" fill="#cdd6f4" style="--duration: 4.4s; --delay: 0.6s;" />
    
    <g class="shooting-star-1">
      <line x1="0" y1="0" x2="65" y2="32" stroke="url(#star-trail-1)" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="65" cy="32" r="1.6" fill="#ffffff" />
    </g>
    <g class="shooting-star-2">
      <line x1="0" y1="0" x2="50" y2="25" stroke="url(#star-trail-2)" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="50" cy="25" r="1.3" fill="#ffffff" />
    </g>
    <g class="shooting-star-3">
      <line x1="0" y1="0" x2="55" y2="27" stroke="url(#star-trail-1)" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="55" cy="27" r="1.4" fill="#ffffff" />
    </g>
  </g>

  <g transform="translate(42, 34)">
    <text class="section-label" x="0" y="0">✦ ABOUT ME</text>
    <text class="main-title" x="0" y="26">Hi, I'm <tspan class="hero-name">Matteo Logozzi</tspan> 👋</text>
    <text class="sub-stats" x="0" y="58">
      <tspan fill="#bac2de">Repos:</tspan> <tspan class="stat-val" fill="#89b4fa">9</tspan>
      <tspan fill="#585b70" dx="10">|</tspan> 
      <tspan fill="#bac2de" dx="10">Stars:</tspan> <tspan class="stat-val" fill="#f9e2af">0</tspan>
      <tspan fill="#585b70" dx="10">|</tspan> 
      <tspan fill="#bac2de" dx="10">Followers:</tspan> <tspan class="stat-val" fill="#a6e3a1">4</tspan>
    </text>
  </g>

  <line x1="42" y1="120" x2="758" y2="120" stroke="url(#sep-grad)" stroke-width="1.5" />

  <g transform="translate(42, 130)">
    <text class="section-label" x="0" y="0">✦ LANGUAGE STACK</text>
    <g transform="translate(0, 18)">
      
    <g transform="translate(0, 0)">
      <circle cx="6" cy="7" r="4" fill="#89b4fa" filter="url(#glow-dot)" />
      <text class="skill-text" x="22" y="11">TypeScript</text>
      <text class="percentage" x="250" y="11">45%</text>
      <rect class="track" x="290" y="3" width="340" height="8" rx="4" />
      <rect class="animated-bar" style="--target-width: 153px;" x="290" y="3" height="8" rx="4" fill="#89b4fa" width="0" />
    </g>
    
    <g transform="translate(0, 26)">
      <circle cx="6" cy="7" r="4" fill="#74c7ec" filter="url(#glow-dot)" />
      <text class="skill-text" x="22" y="11">Python</text>
      <text class="percentage" x="250" y="11">28%</text>
      <rect class="track" x="290" y="3" width="340" height="8" rx="4" />
      <rect class="animated-bar" style="--target-width: 95px;" x="290" y="3" height="8" rx="4" fill="#74c7ec" width="0" />
    </g>
    
    <g transform="translate(0, 52)">
      <circle cx="6" cy="7" r="4" fill="#a6e3a1" filter="url(#glow-dot)" />
      <text class="skill-text" x="22" y="11">Vue</text>
      <text class="percentage" x="250" y="11">8%</text>
      <rect class="track" x="290" y="3" width="340" height="8" rx="4" />
      <rect class="animated-bar" style="--target-width: 27px;" x="290" y="3" height="8" rx="4" fill="#a6e3a1" width="0" />
    </g>
    
    <g transform="translate(0, 78)">
      <circle cx="6" cy="7" r="4" fill="#fab387" filter="url(#glow-dot)" />
      <text class="skill-text" x="22" y="11">HTML</text>
      <text class="percentage" x="250" y="11">5%</text>
      <rect class="track" x="290" y="3" width="340" height="8" rx="4" />
      <rect class="animated-bar" style="--target-width: 17px;" x="290" y="3" height="8" rx="4" fill="#fab387" width="0" />
    </g>
    
    <g transform="translate(0, 104)">
      <circle cx="6" cy="7" r="4" fill="#cba6f7" filter="url(#glow-dot)" />
      <text class="skill-text" x="22" y="11">SCSS</text>
      <text class="percentage" x="250" y="11">5%</text>
      <rect class="track" x="290" y="3" width="340" height="8" rx="4" />
      <rect class="animated-bar" style="--target-width: 17px;" x="290" y="3" height="8" rx="4" fill="#cba6f7" width="0" />
    </g>
    
    </g>
  </g>
</svg>
